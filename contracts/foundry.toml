[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# Monad execution environment for forge/cast/anvil (Foundry >= 1.8): Monad gas model, precompiles,
# contract-size limits. Monad's docs require the osaka EVM target.
network = "monad"
# network = "monad" already implies this; stated because test/LetterlockGas.t.sol depends on it. Each top-level
# write in a test runs as its own transaction, so gas snapshots are whole transactions with cold storage.
isolate = true
solc_version = "0.8.33"
evm_version = "osaka"
optimizer = true
optimizer_runs = 10000
# Keep the default IPFS metadata hash in the bytecode so Sourcify (MonadVision) can do a full match.
bytecode_hash = "ipfs"
# Recompile every test and script that depends on a changed source. Foundry 1.8 turns dynamic test linking on by
# default; with it, an edit inside a function body of src/Letterlock.sol (code or comment) recompiles only that
# file, and script/Deploy.s.sol, which compiles `new Letterlock(...)` into its own bytecode, keeps the previous
# creation code: `forge script` would deploy the old code. This is not a compiler setting, so it changes no bytecode.
# test/Deploy.t.sol (test_scriptArtifactDeploysTheCurrentSource) fails on a stale script artifact.
dynamic_test_linking = false

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 128
fail_on_revert = false

[rpc_endpoints]
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[fmt]
line_length = 120
