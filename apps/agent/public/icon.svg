<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Letterlock — a wax seal pressed shut over one address line on a manila envelope">
<style>
  .ic-sm { display: none }
  @media (max-width: 96px) { .ic-grain { display: none } }
  @media (max-width: 48px) {
    .ic-lg, .ic-mono { display: none }
    .ic-sm { display: inline }
  }
</style>
<defs>
