name: contracts

on:
  push:
    paths:
      - "contracts/**"
      - "packages/letterlock/src/abi.ts"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "packages/letterlock/src/abi.ts"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      # Unit, fuzz, invariant, deploy and gas tests, plus the Monad mainnet fork tests (they skip, with the RPC error,
      # if rpc.monad.xyz is unreachable: LETTERLOCK_REQUIRE_FORK is left unset here, so an RPC outage does not fail CI;
      # the mainnet deploy pre-flight sets it, which fails them instead). --gas-snapshot-check fails only when an
      # entry that is both in snapshots/Letterlock.json and produced by this run has a different value. An entry the
      # run does not produce is dropped from the file, and a new one is added, with exit 0: the next step catches those.
      - name: Test
        run: forge test -vvv --gas-snapshot-check true

      # Fails on any added, removed or rewritten gas snapshot entry (a deleted or renamed benchmark, or a committed
      # snapshot cut down by a filtered run).
      - name: Gas snapshot unchanged
        run: git diff --exit-code -- snapshots/

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: ABI exports match the contract
        run: node script/export-abi.mjs --check

      # The keystore import for a deploy run with no terminal (script/DeployMainnet.md step 0), with random test keys:
      # Foundry must decrypt what it writes back to the same key and address.
      - name: Keystore import from the environment
        run: node --test script/keystore-from-env.test.mjs

      # smoke.mjs writes a PRF stand-in, which opens what is sealed to its key, to --out: any --out inside the
      # repository is refused, after symlinks and letter case are resolved. Its end-to-end run skips here (this job
      # does not install the SDK's dependencies).
      - name: Smoke key files stay out of the repository
        run: node --test script/outside-repo.test.mjs

      # A raw key on a command line is visible in the process list: documented commands use a keystore (--account).
      - name: No private key on a documented command line
        run: "! grep -rn -e '--private-key' README.md script src"
