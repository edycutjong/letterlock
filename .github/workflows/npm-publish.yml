name: npm-publish

# Publishes the SDK and CLI (packages/letterlock) to npm from CI, with provenance: the registry links each version to
# the commit and the run that built it. It builds the code of the version's own tag (v<package.json version>), not
# main: SDK commits after a tag belong to the next release (release.yml). Run by hand. With publish unticked it only checks: the tokens authenticate,
# the staged package is the version in package.json with no "_" field and the pinned rpId, and what would be packed.
# It publishes the staged folder, never a .tgz (a tarball's local path would be recorded in the manifest), and skips a
# version npm already has.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm (unticked: checks only)"
        type: boolean
        default: false
      deprecate_010:
        description: "Deprecate 0.1.0, which pins the retired rpId"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # npm provenance
      actions: write    # start the site's deploy, which waits for npm
    defaults:
      run:
        working-directory: packages/letterlock
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The version main names, built from its tag. npm provenance records $GITHUB_REF@$GITHUB_SHA
      # (libnpmpublish/lib/provenance.js), never the checked-out commit, so a publish is allowed only when the tag's
      # commit is the commit this run was dispatched on; otherwise publish from release.yml. Checks and deprecations
      # are unaffected.
      - name: Check out the version's tag
        working-directory: .
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          v=$(jq -r .version packages/letterlock/package.json)
          git fetch --depth=1 origin "refs/tags/v$v:refs/tags/v$v" || { echo "::error::v$v is not tagged"; exit 1; }
          git checkout -q "v$v"
          if [ "$PUBLISH" = "true" ] && [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::v$v is $(git rev-parse --short HEAD), but npm provenance would name $GITHUB_SHA: publish from release.yml, or dispatch on a ref whose HEAD is v$v"
            exit 1
          fi
          echo "building letterlock $v from $(git rev-parse --short HEAD) (tag v$v)"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: npm token authenticates
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::the NPM_TOKEN secret is empty or missing"; exit 1; }
          user=$(npm whoami) || { echo "::error::npm rejected NPM_TOKEN (expired, revoked, or not an npm access token)"; exit 1; }
          echo "npm user: $user"

      - name: Vercel token authenticates
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::the VERCEL_TOKEN secret is empty or missing"; exit 1; }
          code=$(curl -s -o /tmp/u.json -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user)
          test "$code" = 200 || { echo "::error::Vercel answered $code"; exit 1; }
          echo "Vercel user: $(jq -r .user.username /tmp/u.json)"

      - name: Build and check the staged package
        id: pkg
        run: |
          pnpm build
          v=$(jq -r .version dist/package.json)
          test "$v" = "$(jq -r .version package.json)"
          test "$(jq -c '[keys[] | select(startswith("_"))]' dist/package.json)" = "[]"
          grep -q 'LETTERLOCK_RP_ID = "app.letterlock.edycu.dev"' dist/index.d.ts
          npm pack ./dist --dry-run
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "letterlock@$v" version >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - name: Publish
        if: inputs.publish && steps.pkg.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          V: ${{ steps.pkg.outputs.version }}
        run: |
          npm publish ./dist --provenance --access public
          # npm takes a few minutes to serve a new version ("Your package is being processed"); the site's deploy needs it
          for _ in $(seq 1 40); do npm view "letterlock@$V" version >/dev/null 2>&1 && break; sleep 15; done
          npm view "letterlock@$V" version dist.attestations.provenance.predicateType

      # the site names the version on npm, so its deploy waits for it (deploy.yml): start it now
      - name: Deploy the site
        if: inputs.publish && steps.pkg.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Already on npm
        if: inputs.publish && steps.pkg.outputs.exists == 'true'
        run: echo "letterlock@${{ steps.pkg.outputs.version }} is already on npm; nothing published"

      - name: Deprecate 0.1.0
        if: inputs.deprecate_010
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm deprecate letterlock@0.1.0 "pins the retired rpId letterlock-app.vercel.app: install the latest version"
